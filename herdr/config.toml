# herdr config — overrides only; anything omitted uses herdr's defaults.
#
# ── Unified keymap ──────────────────────────────────────────────────────────
# Prefix: ctrl+a (hold ctrl the whole time; the rest are ctrl chords too).
#
# NAVIGATE — the compass (direction = what you move):
#   ctrl+i / ctrl+k  → prev / next SPACE   (↑ / ↓)
#   ctrl+j / ctrl+l  → prev / next TAB     (← / →)
#   (Hammerspoon maps ctrl+i/k/j/l to the arrow keys globally.)
#
# ACT — verb = letter, scope = shift:
#   n = new,  r = rename,  w = close
#   no shift → acts on the TAB (small),  shift → acts on the WORKSPACE (big)
# ─────────────────────────────────────────────────────────────────────────────

[keys]
prefix = "ctrl+a"

# Navigate
previous_workspace = "prefix+up"      # ctrl+i
next_workspace     = "prefix+down"    # ctrl+k
previous_tab       = "prefix+left"    # ctrl+j
next_tab           = "prefix+right"   # ctrl+l

# Act on a TAB (no shift)
new_tab    = "prefix+ctrl+n"
rename_tab = "prefix+ctrl+r"
close_tab  = "prefix+ctrl+w"

# Act on a WORKSPACE (shift = the bigger thing)
new_workspace    = "prefix+ctrl+shift+n"
rename_workspace = "prefix+ctrl+shift+r"
close_workspace  = "prefix+ctrl+shift+w"

[session]
# After a restart, resume supported agent panes back into their conversations.
resume_agents_on_restore = true
